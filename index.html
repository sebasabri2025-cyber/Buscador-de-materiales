<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<meta name="description" content="Buscador de materiales">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Materiales</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#17202a;background:#eef2f6}
*{box-sizing:border-box} body{margin:0}
header{background:#1769e0;color:#fff;padding:22px 18px 20px}
header h1{margin:0;font-size:25px} header p{margin:5px 0 0;opacity:.9}
main{max-width:900px;margin:auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 15px #00000012}
.search{display:flex;gap:9px}
input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:11px;padding:14px;font-size:17px;outline:0}
input:focus{border-color:#1769e0;box-shadow:0 0 0 3px #1769e01f}
button{border:0;border-radius:11px;background:#1769e0;color:#fff;padding:0 18px;font-size:16px}
.info{font-size:13px;color:#667085;margin:13px 2px}
.results{display:grid;gap:10px}
.item{border:1px solid #e3e7eb;border-radius:13px;padding:14px;background:#fff}
.code{font-weight:800;color:#1769e0;font-size:16px}
.desc{font-size:16px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cell{background:#f7f9fb;border-radius:9px;padding:8px}
.label{font-size:11px;color:#667085}.value{font-weight:600;font-size:13px;margin-top:2px}
mark{background:#fff09a;border-radius:3px}
.empty{text-align:center;color:#667085;padding:30px 10px}
@media(max-width:560px){.search{flex-direction:column}.search button{height:46px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1>🔎 Materiales</h1><p>Buscador de stock</p></header>
<main>
<div class="card">
<div class="search">
<input id="q" autocomplete="off" autofocus placeholder="Buscar por código o descripción...">
<button id="btn">Buscar</button>
</div>
<div id="info" class="info"></div>
<div id="results" class="results"></div>
</div>
</main>
<script src="data.js"></script>
<script>
const q=document.getElementById('q'), results=document.getElementById('results'), info=document.getElementById('info');
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function score(x, query){
 const code=norm(x.material), desc=norm(x.descripcion), hay=code+' '+desc;
 if(code===query)return 1000;if(desc===query)return 900;
 if(code.startsWith(query))return 800;if(desc.startsWith(query))return 700;
 if(code.includes(query))return 600;if(desc.includes(query))return 500;
 const terms=query.split(/\s+/).filter(Boolean);
 const hits=terms.filter(t=>hay.includes(t)).length;
 return hits===terms.length?300+hits:0;
}
function mark(s,query){
 let out=esc(s);
 for(const t of query.split(/\s+/).filter(Boolean).sort((a,b)=>b.length-a.length)){
  const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  out=out.replace(re,'<mark>$1</mark>');
 }
 return out;
}
function search(){
 const query=norm(q.value.trim());
 if(!query){info.textContent=`${MATERIALS.length} materiales cargados`;results.innerHTML='<div class="empty">Escribí un código o una descripción.</div>';return;}
 const found=MATERIALS.map(x=>({x,s:score(x,query)})).filter(x=>x.s>0)
 .sort((a,b)=>b.s-a.s);
 info.textContent=`${found.length} resultado(s) de ${MATERIALS.length} materiales`;
 results.innerHTML=found.length?found.map(({x})=>`
 <div class="item">
  <div class="code">${mark(x.material,query)}</div>
  <div class="desc">${mark(x.descripcion,query)}</div>
  <div class="grid">
   <div class="cell"><div class="label">Stock</div><div class="value">${esc(x.stock)}</div></div>
   <div class="cell"><div class="label">Unidad</div><div class="value">${esc(x.unidad)}</div></div>
   <div class="cell"><div class="label">Lote</div><div class="value">${esc(x.lote)}</div></div>
   <div class="cell"><div class="label">Centro</div><div class="value">${esc(x.centro)}</div></div>
   <div class="cell"><div class="label">Almacén</div><div class="value">${esc(x.almacen)}</div></div>
  </div>
 </div>`).join(''):'<div class="empty">No se encontraron materiales.</div>';
}
q.addEventListener('input',search);q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
document.getElementById('btn').addEventListener('click',search);
info.textContent=`${MATERIALS.length} materiales cargados`;
results.innerHTML='<div class="empty">Buscá por código o descripción.</div>';
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body></html>
